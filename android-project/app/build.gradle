plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'net.novacubegame'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "net.novacubegame"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        resConfigs "en"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '4.1.2'
        }
    }
    buildFeatures {
        prefab true
    }
    ndkVersion '29.0.14206865'
    buildToolsVersion '36.1.0'
}

dependencies {
    implementation files('libs/SDL3-3.5.0.aar')
}
